services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estadisticas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/estadisticas
      - PYTHONUNBUFFERED=1
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY:-}
      - CSV_DATA_PATH=/app/data/results.csv
      - RUN_STARTUP_SYNC=false
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend:/app:cached
      - ./data:/app/data:cached
      - ./shared:/app/shared:cached
    ports:
      - "8000:8000"
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  sync_worker:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/estadisticas
      - PYTHONUNBUFFERED=1
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY:-}
      - CSV_DATA_PATH=/app/data/results.csv
    volumes:
      - ./backend:/app:cached
      - ./data:/app/data:cached
      - ./shared:/app/shared:cached
    command: >
      sh -c "alembic upgrade head;
      while true; do
      python -c 'from app.sync import sync_fixtures_and_metrics; print(sync_fixtures_and_metrics())';
      sleep 300;
      done"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  postgres_data:
    name: estadisticas_postgres_data
