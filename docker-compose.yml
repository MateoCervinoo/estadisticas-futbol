version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estadisticas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/estadisticas
      - PYTHONUNBUFFERED=1
      - API_FOOTBALL_KEY=48845f6680654134b9cb9b1f00bec169
      - CSV_DATA_PATH=/app/data/results.csv
    volumes:
      - ./backend:/app:cached
      - ./data:/app/data:cached
    ports:
      - "8000:8000"

  sync_worker:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/estadisticas
      - PYTHONUNBUFFERED=1
      - API_FOOTBALL_KEY=48845f6680654134b9cb9b1f00bec169
      - CSV_DATA_PATH=/app/data/results.csv
    volumes:
      - ./backend:/app:cached
      - ./data:/app/data:cached
    command: >
      sh -c "while true; do
      python -c 'from app.sync import sync_fixtures_and_metrics; print(sync_fixtures_and_metrics())';
      sleep 300;
      done"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  postgres_data:
    name: estadisticas_postgres_data
